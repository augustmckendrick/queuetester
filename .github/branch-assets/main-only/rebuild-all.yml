# .github/workflows/rebuild-all.yml

# Thin trigger stub: the real logic lives in rebuild-all-impl.yml on the
# ciworkflows branch (all CI/release assets live there; main only keeps the
# ci-caller.yml delegator and workflow_dispatch stubs like this one, since
# GitHub only lets workflow_dispatch workflows be triggered from workflow
# files present on the default branch).
name: Rebuild All Release Docs to gh-pages

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: deploy-docs
  queue: max

jobs:
  rebuild-all:
    uses: augustmckendrick/queuetester/.github/workflows/rebuild-all-impl.yml@ciworkflows
    secrets: inherit
