name: Deploy Docs Directly

env:
  LATEST_RELEASE_BRANCH: release-v1.19.0

on:
  push:
    branches:
      - main
      - 'release-v*'

  # Allows you to run the workflow manually and choose a branch.
  workflow_dispatch:

# Only one deployment may modify gh-pages at a time.
# Additional runs wait in GitHub's native queue.
concurrency:
  group: docs-deployment
  queue: max

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Validate branch name
        shell: bash
        run: |
          set -euo pipefail

          BRANCH="$GITHUB_REF_NAME"

          if ! [[ "$BRANCH" =~ ^(main|release-v[0-9]+(\.[0-9]+)*)$ ]]; then
            echo "ERROR: '$BRANCH' is not main or a valid release branch."
            exit 1
          fi

          echo "Deploying documentation from branch: $BRANCH"

      - name: Checkout the branch that triggered this run
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [[ -f requirements.txt ]]; then
            pip install -r requirements.txt
          else
            echo "ERROR: requirements.txt was not found."
            exit 1
          fi

      - name: Show installed versions
        run: |
          python --version
          mike --version
          mkdocs --version

      - name: Deploy documentation
        shell: bash
        run: |
          set -euo pipefail

          BRANCH="$GITHUB_REF_NAME"
          VERSION="${BRANCH#release-}"
          echo "Deploying $BRANCH as $VERSION"

          if [[ "$BRANCH" == "main" ]]; then
            echo "Deploying main as next"
            mike deploy \
              --title "next" \
              --update-aliases \
              --push \
              --alias-type=copy \
              next head

          elif [[ "$BRANCH" == "$LATEST_RELEASE_BRANCH" ]]; then
            echo "Deploying $BRANCH as latest and stable"
            mike deploy \
              --title "$VERSION (latest)" \
              --update-aliases \
              --push \
              --alias-type=copy \
              $VERSION latest stable

            mike set-default --push latest

          else
            VERSION="${BRANCH#release-}"

            echo "Deploying $BRANCH as $VERSION"
            mike deploy \
              --title "$VERSION" \
              --update-aliases \
              --push \
              "$VERSION"
          fi

      - name: Report completion
        run: |
          echo "Deployment completed."
          echo "Source branch: $GITHUB_REF_NAME"
          echo "Commit: $GITHUB_SHA"
