# .github/workflows/rebuild-all-impl.yml

# Real implementation, lives only on the ciworkflows branch. main carries a
# thin workflow_dispatch stub (rebuild-all.yml) that calls this via `uses:`,
# since GitHub only allows workflow_dispatch to be triggered from workflow
# files present on the default branch.
name: Rebuild All Release Docs to gh-pages

on:
  workflow_call:

jobs:
  find-releases:
    runs-on: ubuntu-latest

    outputs:
      branches: ${{ steps.branches.outputs.branches }}

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Checkout branch config
        uses: actions/checkout@v6
        with:
          ref: ciworkflows
          sparse-checkout: |
            .github/workflows/release-branches.json
          sparse-checkout-cone-mode: false

      - name: List branches from release-branches.json
        id: branches
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PYEOF' >> "$GITHUB_OUTPUT"
          import json

          with open(".github/workflows/release-branches.json") as f:
              branches = json.load(f) or {}

          print("branches=" + json.dumps(list(branches)))
          PYEOF

          echo "Release branches:"
          cat "$GITHUB_OUTPUT"

  deploy:
    needs: find-releases

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        branch: ${{ fromJSON(needs.find-releases.outputs.branches) }}

    uses: augustmckendrick/queuetester/.github/workflows/shared-ci.yml@ciworkflows

    with:
      branch: ${{ matrix.branch }}

    secrets: inherit

  publish-to-pages:
    needs: deploy
    uses: augustmckendrick/queuetester/.github/workflows/deploy-pages.yml@ciworkflows
    secrets: inherit
