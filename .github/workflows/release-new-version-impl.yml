# .github/workflows/release-new-version-impl.yml

# Real implementation, lives only on the ciworkflows branch. main carries a
# thin workflow_dispatch stub (release-new-version.yml) that calls this via
# `uses:`, since GitHub only allows workflow_dispatch to be triggered from
# workflow files present on the default branch.
#
# Cuts a new release branch from main:
#   1. Registers the new branch in release-branches.json on ciworkflows and
#      promotes it to the "stable"/"latest" version (named via main's
#      mkdocs.yml's extra.docsVersionInfo.releaseBranchName).
#   2. Branches main into that new release branch, stripping every workflow
#      file except ci-caller.yml (the release branch delegates its CI to
#      ciworkflows).
#
# release-branches.json is updated *before* the release branch is pushed so
# that when the branch's own push triggers ci-caller.yml -> shared-ci.yml, it
# already finds itself listed in release-branches.json and deploys
# immediately -- no separate explicit deploy job needed. Each of these two
# pushes is a single commit, so each triggers exactly one downstream CI run
# instead of racing multiple runs against the same GitHub Pages deployment.
name: Release new version

on:
  workflow_call:

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}
          path: main

      - name: Checkout ciworkflows
        uses: actions/checkout@v6
        with:
          ref: ciworkflows
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}
          path: ciworkflows

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Configure Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine release branch
        id: release_info
        shell: bash
        working-directory: main
        run: |
          set -euo pipefail

          RELEASE_BRANCH=$(sed -n 's/^[[:space:]]*releaseBranchName:[[:space:]]*//p' mkdocs.yml | head -n1)

          if [[ -z "$RELEASE_BRANCH" ]]; then
            echo "ERROR: could not find extra.docsVersionInfo.releaseBranchName in mkdocs.yml" >&2
            exit 1
          fi

          if git ls-remote --exit-code --heads origin "$RELEASE_BRANCH" >/dev/null 2>&1; then
            echo "ERROR: branch '$RELEASE_BRANCH' already exists on origin." >&2
            exit 1
          fi

          VERSION="${RELEASE_BRANCH#release-}"

          echo "branch=$RELEASE_BRANCH" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION on branch $RELEASE_BRANCH"

      - name: Add release to release-branches.json on ciworkflows
        id: bump_json
        shell: bash
        working-directory: ciworkflows
        env:
          RELEASE_BRANCH: ${{ steps.release_info.outputs.branch }}
          VERSION: ${{ steps.release_info.outputs.version }}
        run: |
          set -euo pipefail

          python3 - <<'PYEOF'
          import json
          import os

          path = ".github/workflows/release-branches.json"
          release_branch = os.environ["RELEASE_BRANCH"]
          version = os.environ["VERSION"]

          with open(path) as f:
              data = json.load(f)

          if release_branch in data:
              raise SystemExit(f"ERROR: '{release_branch}' is already present in release-branches.json")

          demoted_versions = []
          for entry in data.values():
              aliases = entry.get("aliases") or []
              if "stable" in aliases or "latest" in aliases:
                  entry["aliases"] = [a for a in aliases if a not in ("stable", "latest")]
                  entry.pop("title", None)
                  demoted_versions.append(entry["version"])

          data[release_branch] = {
              "version": version,
              "title": f"{version} (latest)",
              "aliases": ["stable", "latest"],
          }

          with open(path, "w") as f:
              json.dump(data, f, indent=2)
              f.write("\n")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("demoted_versions=" + " ".join(demoted_versions) + "\n")
          PYEOF

          git add .github/workflows/release-branches.json
          git commit -m "Add $RELEASE_BRANCH to release-branches.json and promote to stable/latest"
          git push origin ciworkflows

      - name: Install docs dependencies
        if: steps.bump_json.outputs.demoted_versions != ''
        shell: bash
        working-directory: main
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Retitle demoted version(s) in versions.json
        # release-branches.json is our own bookkeeping; it's not what drives
        # the version dropdown on the published site. That's versions.json,
        # which mike maintains on gh-pages and only touches for the version
        # it's actively deploying. So the old "latest" version's docs never
        # get rebuilt here, but mike still needs telling to drop the
        # "(latest)" suffix from its title -- otherwise the site keeps
        # showing two versions labeled latest until the next full rebuild.
        if: steps.bump_json.outputs.demoted_versions != ''
        shell: bash
        working-directory: main
        env:
          DEMOTED_VERSIONS: ${{ steps.bump_json.outputs.demoted_versions }}
        run: |
          set -euo pipefail

          for v in $DEMOTED_VERSIONS; do
            echo "Retitling $v to drop its (latest) title in versions.json"
            mike retitle "$v" "$v" --push
          done

      - name: Cut release branch from main
        shell: bash
        working-directory: main
        env:
          RELEASE_BRANCH: ${{ steps.release_info.outputs.branch }}
        run: |
          set -euo pipefail

          git checkout -b "$RELEASE_BRANCH"
          find .github/workflows -maxdepth 1 -type f ! -name 'ci-caller.yml' -delete

          git add .github/workflows
          git commit -m "Cut $RELEASE_BRANCH from main"
          git push origin "$RELEASE_BRANCH"
