name: Individual Branch CI

on:
  workflow_call:
    inputs:
      branch:
        description: "Branch whose documentation should be deployed"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    # If a branch was explicitly supplied, use it.
    # Otherwise use the branch that triggered the calling workflow.
    env:
      SOURCE_BRANCH: ${{ inputs.branch || github.ref_name }}

    steps:
      - name: Validate branch name
        shell: bash
        run: |
          set -euo pipefail

          BRANCH="$SOURCE_BRANCH"

          if ! [[ "$BRANCH" =~ ^(main|release-v[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "ERROR: '$BRANCH' is not main or a valid release-vX.Y.Z branch."
            exit 1
          fi

          echo "Deploying documentation from branch: $BRANCH"

      - name: Checkout source branch
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_BRANCH }}
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          if [[ -f requirements.txt ]]; then
            pip install -r requirements.txt
          else
            echo "ERROR: requirements.txt was not found."
            exit 1
          fi

      - name: Show installed versions
        run: |
          python --version
          mike --version
          mkdocs --version

      - name: Deploy documentation
        shell: bash
        run: |
          set -euo pipefail

          BRANCH="$SOURCE_BRANCH"
          VERSION="${BRANCH#release-}"

          echo "Deploying release branch: $BRANCH"
          echo "Release version: $VERSION"

          echo "Deploying $BRANCH as $VERSION"

          mike deploy \
            --title "$VERSION" \
            --update-aliases \
            --push \
            "$VERSION"
            
      - name: Report completion
        shell: bash
        run: |
          echo "Mike processing completed."
          echo "Source branch: $SOURCE_BRANCH"
          echo "Commit: $(git rev-parse HEAD)"
