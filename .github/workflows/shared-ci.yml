name: Shared CI

on:
  workflow_call:
    inputs:
      branch:
        description: "Branch whose documentation should be deployed"
        required: false
        type: string
        default: ""

# Only one deployment may modify gh-pages at a time.
# Additional runs wait in GitHub's native queue.
concurrency:
  group: docs-deployment
  queue: max

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    # If a branch was explicitly supplied, use it.
    # Otherwise use the branch that triggered the calling workflow.
    env:
      SOURCE_BRANCH: ${{ inputs.branch || github.ref_name }}

    steps:
      - name: Validate branch name
        shell: bash
        run: |
          set -euo pipefail

          BRANCH="$SOURCE_BRANCH"

          if ! [[ "$BRANCH" =~ ^(main|release-v[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "ERROR: '$BRANCH' is not main or a valid release-vX.Y.Z branch."
            exit 1
          fi

          echo "Deploying documentation from branch: $BRANCH"

      - name: Checkout source branch
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_BRANCH }}
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          if [[ -f requirements.txt ]]; then
            pip install -r requirements.txt
          else
            echo "ERROR: requirements.txt was not found."
            exit 1
          fi

      - name: Show installed versions
        run: |
          python --version
          mike --version
          mkdocs --version

      - name: Prepare gh-pages
        shell: bash
        run: |
          set -euo pipefail

          # Ensure the gh-pages branch exists.
          if git fetch origin gh-pages 2>/dev/null; then
            echo "Found existing gh-pages branch."
            git branch -f gh-pages origin/gh-pages
          else
            echo "gh-pages does not exist. Creating it."

            git worktree add --detach /tmp/gh-pages-init
            cd /tmp/gh-pages-init

            git checkout --orphan gh-pages

            # Remove files inherited from the source checkout.
            git rm -rf . >/dev/null 2>&1 || true

            printf '[]\n' > versions.json

            git add versions.json
            git commit -m "Initialize gh-pages"
            git push origin gh-pages

            cd "$GITHUB_WORKSPACE"
            git worktree remove /tmp/gh-pages-init

            git fetch origin gh-pages
            git branch -f gh-pages origin/gh-pages
          fi

          # Ensure versions.json exists and contains valid JSON.
          if ! git show gh-pages:versions.json 2>/dev/null | jq empty 2>/dev/null; then
            echo "versions.json is missing or invalid. Initializing it."

            git worktree add /tmp/gh-pages-init gh-pages

            printf '[]\n' > /tmp/gh-pages-init/versions.json

            cd /tmp/gh-pages-init

            git add versions.json

            if ! git diff --cached --quiet; then
              git commit -m "Initialize versions.json"
              git push origin gh-pages
            fi

            cd "$GITHUB_WORKSPACE"
            git worktree remove /tmp/gh-pages-init

            git fetch origin gh-pages
            git branch -f gh-pages origin/gh-pages
          fi

      - name: Deploy documentation
        shell: bash
        run: |
          set -euo pipefail

          BRANCH="$SOURCE_BRANCH"

          # main is not a release version.
          if [[ "$BRANCH" == "main" ]]; then
            echo "Deploying main as next"

            mike deploy \
              --title "next" \
              --update-aliases \
              --push \
              --alias-type=copy \
              next head

            exit 0
          fi

          # Everything below here is a release branch.
          VERSION="${BRANCH#release-}"

          echo "Deploying release branch: $BRANCH"
          echo "Release version: $VERSION"

          EXISTING_VERSIONS="$(
            git show gh-pages:versions.json |
            jq -r '
              .[]
              | .version
              | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))
            '
          )"

          echo "Existing versions:"
          printf '%s\n' "$EXISTING_VERSIONS"

          # Include the version currently being deployed because it may
          # not exist in versions.json yet.
          LATEST_VERSION="$(
            {
              printf '%s\n' "$EXISTING_VERSIONS"
              printf '%s\n' "$VERSION"
            } |
            sed '/^$/d' |
            sort -V |
            tail -n 1
          )"

          echo "Current version: $VERSION"
          echo "Highest version: $LATEST_VERSION"

          if [[ "$VERSION" == "$LATEST_VERSION" ]]; then

            echo "Removing old '(latest)' label"

            git worktree add /tmp/gh-pages gh-pages

            sed -i 's/ (latest)//g' /tmp/gh-pages/versions.json

            cd /tmp/gh-pages

            git add versions.json

            if ! git diff --cached --quiet; then
              git commit -m "Clear old latest label"
              git push origin gh-pages
            else
              echo "No old '(latest)' label found."
            fi

            cd "$GITHUB_WORKSPACE"
            git worktree remove /tmp/gh-pages

            # Refresh the local gh-pages branch after the metadata push.
            git fetch origin gh-pages
            git branch -f gh-pages origin/gh-pages

            echo "Deploying $BRANCH as latest and stable"

            mike deploy \
              --title "$VERSION (latest)" \
              --update-aliases \
              --push \
              --alias-type=copy \
              "$VERSION" latest stable

            mike set-default --push latest

          else

            echo "Deploying $BRANCH as $VERSION"

            mike deploy \
              --title "$VERSION" \
              --update-aliases \
              --push \
              "$VERSION"
          fi

      - name: Report completion
        shell: bash
        run: |
          echo "Deployment completed."
          echo "Source branch: $SOURCE_BRANCH"
          echo "Commit: $(git rev-parse HEAD)"

  publish:
    needs: deploy
    uses: augustmckendrick/queuetester/.github/workflows/publish-docs.yml@main
    with:
      branch: ${{ inputs.branch || github.ref_name }}
    secrets: inherit