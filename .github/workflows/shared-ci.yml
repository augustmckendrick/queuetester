name: Individual Branch CI

on:
  workflow_call:
    inputs:
      branch:
        description: "Branch whose documentation should be deployed"
        required: false
        type: string
        default: ""
    outputs:
      skip:
        description: "true if the branch is not listed in release-branches.json and nothing was deployed"
        value: ${{ jobs.deploy.outputs.skip }}


jobs:
  deploy:
    runs-on: ubuntu-latest

    # If a branch was explicitly supplied, use it.
    # Otherwise use the branch that triggered the calling workflow.
    env:
      SOURCE_BRANCH: ${{ inputs.branch || github.ref_name }}

    outputs:
      skip: ${{ steps.branch_config.outputs.skip }}

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Checkout branch config from main
        uses: actions/checkout@v6
        with:
          ref: main
          sparse-checkout: |
            .github/workflows/release-branches.json
          sparse-checkout-cone-mode: false
          path: branch-config

      - name: Resolve branch configuration
        id: branch_config
        shell: bash
        run: |
          set -euo pipefail

          python3 - "$SOURCE_BRANCH" <<'PYEOF' >> "$GITHUB_OUTPUT"
          import json
          import sys

          branch = sys.argv[1]

          with open("branch-config/.github/workflows/release-branches.json") as f:
              branches = json.load(f) or {}

          if branch not in branches:
              valid = ", ".join(sorted(branches)) or "(none defined)"
              print(f"::notice::'{branch}' is not listed in release-branches.json (valid branches: {valid}); skipping deploy.", file=sys.stderr)
              print("skip=true")
              sys.exit(0)

          entry = branches[branch] or {}
          version = entry.get("version")
          title = entry.get("title") or version
          aliases = entry.get("aliases") or []

          if not version:
              sys.exit(f"ERROR: '{branch}' in release-branches.json has no 'version' set.")

          print("skip=false")
          print(f"version={version}")
          print(f"title={title}")
          print(f"aliases={' '.join(aliases)}")
          PYEOF

          if [[ "$(grep -c '^skip=true$' "$GITHUB_OUTPUT")" -gt 0 ]]; then
            echo "Skipping deploy: $SOURCE_BRANCH is not a release branch."
          else
            echo "Deploying documentation from branch: $SOURCE_BRANCH"
          fi

      - name: Checkout source branch
        if: steps.branch_config.outputs.skip != 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_BRANCH }}
          fetch-depth: 0

      - name: Configure Git identity
        if: steps.branch_config.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        if: steps.branch_config.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          if [[ -f requirements.txt ]]; then
            pip install -r requirements.txt
          else
            echo "ERROR: requirements.txt was not found."
            exit 1
          fi

      - name: Show installed versions
        if: steps.branch_config.outputs.skip != 'true'
        run: |
          python --version
          mike --version
          mkdocs --version

      - name: Deploy documentation
        if: steps.branch_config.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.branch_config.outputs.version }}"
          TITLE="${{ steps.branch_config.outputs.title }}"
          ALIASES="${{ steps.branch_config.outputs.aliases }}"

          echo "Deploying release branch: $SOURCE_BRANCH"
          echo "Release version: $VERSION"
          echo "Release title: $TITLE"
          echo "Aliases: ${ALIASES:-(none)}"

          mike deploy \
            --title "$TITLE" \
            --alias-type=redirect \
            --update-aliases \
            --push \
            "$VERSION" $ALIASES

      - name: Set default version to latest
        if: steps.branch_config.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail

          if mike list latest >/dev/null 2>&1; then
            mike set-default latest --push
          else
            echo "No 'latest' alias deployed yet; skipping default version update."
          fi

      - name: Report completion
        if: steps.branch_config.outputs.skip != 'true'
        shell: bash
        run: |
          echo "Mike processing completed."
          echo "Source branch: $SOURCE_BRANCH"
          echo "Commit: $(git rev-parse HEAD)"
