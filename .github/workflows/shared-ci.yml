name: Individual Branch CI

on:
  workflow_call:
    inputs:
      branch:
        description: "Branch whose documentation should be deployed"
        required: false
        type: string
        default: ""

# Only one deployment may modify gh-pages at a time.
# Additional runs wait in GitHub's native queue.
concurrency:
  group: docs-deployment
  queue: max

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    # If a branch was explicitly supplied, use it.
    # Otherwise use the branch that triggered the calling workflow.
    env:
      SOURCE_BRANCH: ${{ inputs.branch || github.ref_name }}

    steps:
      - name: Validate branch name
        shell: bash
        run: |
          set -euo pipefail

          BRANCH="$SOURCE_BRANCH"

          if ! [[ "$BRANCH" =~ ^(main|release-v[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "ERROR: '$BRANCH' is not main or a valid release-vX.Y.Z branch."
            exit 1
          fi

          echo "Deploying documentation from branch: $BRANCH"

      - name: Checkout source branch
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_BRANCH }}
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          if [[ -f requirements.txt ]]; then
            pip install -r requirements.txt
          else
            echo "ERROR: requirements.txt was not found."
            exit 1
          fi

      - name: Show installed versions
        run: |
          python --version
          mike --version
          mkdocs --version

      - name: Deploy documentation
        shell: bash
        run: |
          set -euo pipefail

          BRANCH="$SOURCE_BRANCH"
          VERSION="${BRANCH#release-}"

          echo "Deploying release branch: $BRANCH"
          echo "Release version: $VERSION"

          echo "Deploying $BRANCH as $VERSION"

          mike deploy \
            --title "$VERSION" \
            --update-aliases \
            --push \
            "$VERSION"

          EXISTING_VERSIONS="$(
            git show gh-pages:versions.json |
            jq -r '
              .[]
              | .version
              | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))
            '
          )"

          echo "Existing versions:"
          printf '%s\n' "$EXISTING_VERSIONS"

          LATEST_VERSION="$(
            {
              printf '%s\n' "$EXISTING_VERSIONS"
            } |
            sed '/^$/d' |
            sort -V |
            tail -n 1
          )"

          echo "Current version: $VERSION"
          echo "Highest version: $LATEST_VERSION"

          if [[ "$VERSION" == "$LATEST_VERSION" ]]; then

            echo "Removing old '(latest)' label"

            git worktree add /tmp/gh-pages gh-pages

            sed -i 's/ (latest)//g' /tmp/gh-pages/versions.json

            cd /tmp/gh-pages

            git add versions.json

            if ! git diff --cached --quiet; then
              git commit -m "Clear old latest label"
              git push origin gh-pages
            else
              echo "No old '(latest)' label found."
            fi

            cd "$GITHUB_WORKSPACE"
            git worktree remove /tmp/gh-pages

            # Refresh the local gh-pages branch after the metadata push.
            git fetch origin gh-pages
            git branch -f gh-pages origin/gh-pages

            echo "Deploying $BRANCH as latest and stable"

            mike deploy \
              --title "$VERSION (latest)" \
              --update-aliases \
              --push \
              --alias-type=copy \
              "$VERSION" latest stable

            mike set-default --push latest

          fi

      - name: Report completion
        shell: bash
        run: |
          echo "Mike processing completed."
          echo "Source branch: $SOURCE_BRANCH"
          echo "Commit: $(git rev-parse HEAD)"