name: Rebuild All Release Docs to gh-pages

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  find-releases:
    runs-on: ubuntu-latest

    outputs:
      branches: ${{ steps.branches.outputs.branches }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Find release branches
        id: branches
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin

          BRANCHES="$(
            git for-each-ref \
              --format='%(refname:short)' \
              'refs/remotes/origin/release-v*' |
            sed 's#^origin/##' |
            jq -R -s -c '
              split("\n")
              | map(select(length > 0))
            '
          )"

          echo "Release branches:"
          echo "$BRANCHES"

          echo "branches=$BRANCHES" >> "$GITHUB_OUTPUT"

  deploy:
    needs: find-releases

    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(needs.find-releases.outputs.branches) }}

    uses: augustmckendrick/queuetester/.github/workflows/shared-ci.yml@main

    with:
      branch: ${{ matrix.branch }}

    secrets: inherit