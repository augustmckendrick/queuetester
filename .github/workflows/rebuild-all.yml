# .github/workflows/rebuild-all.yml

# Lives only on the main branch, which carries the full CI/release logic
# directly (no stub/impl split, no ciworkflows branch).
name: Rebuild All Release Docs to gh-pages

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: deploy-docs
  queue: max

jobs:
  find-releases:
    runs-on: ubuntu-latest

    outputs:
      branches: ${{ steps.branches.outputs.branches }}

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Checkout branch config from release-management
        uses: actions/checkout@v6
        with:
          ref: release-management
          sparse-checkout: |
            release-branches.json
          sparse-checkout-cone-mode: false

      - name: List branches from release-branches.json
        id: branches
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PYEOF' >> "$GITHUB_OUTPUT"
          import json

          with open("release-branches.json") as f:
              branches = json.load(f) or {}

          print("branches=" + json.dumps(list(branches)))
          PYEOF

          echo "Release branches:"
          cat "$GITHUB_OUTPUT"

  deploy:
    needs: find-releases

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        branch: ${{ fromJSON(needs.find-releases.outputs.branches) }}

    uses: augustmckendrick/queuetester/.github/workflows/shared-ci.yml@main

    with:
      branch: ${{ matrix.branch }}

    secrets: inherit

  publish-to-pages:
    needs: deploy
    uses: augustmckendrick/queuetester/.github/workflows/deploy-pages.yml@main
    secrets: inherit
