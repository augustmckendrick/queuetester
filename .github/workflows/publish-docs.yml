name: Publish Docs To External Server

on:
  workflow_call:
    inputs:
      branch:
        description: "Optional source branch to publish. Leave blank to publish all gh-pages content."
        required: false
        type: string
        default: ""

  workflow_dispatch:
    inputs:
      branch:
        description: "Optional source branch to publish. Leave blank to publish all gh-pages content."
        required: false
        type: string
        default: ""

env:
  DOCS_HOST: ec2-16-52-70-117.ca-central-1.compute.amazonaws.com
  DOCS_USER: ubuntu
  DOCS_ROOT: /home/ubuntu/docshome/

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Publish documentation
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          echo "${{ secrets.DOCS_SSH_KEY }}" > ~/.ssh/docs_key.pem
          chmod 600 ~/.ssh/docs_key.pem
          ssh-keyscan -H "$DOCS_HOST" >> ~/.ssh/known_hosts

          git fetch origin gh-pages
          git worktree add /tmp/gh-pages origin/gh-pages

          SSH_COMMAND="ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -i ~/.ssh/docs_key.pem"

          rsync -rv --delete \
            -e "$SSH_COMMAND" \
            /tmp/gh-pages/ \
            "${DOCS_USER}@${DOCS_HOST}:${DOCS_ROOT}/"

          git worktree remove /tmp/gh-pages
          git worktree prune
