name: Publish Docs To External Server

on:
  workflow_call:
  workflow_dispatch:

env:
  DOCS_HOST: ec2-15-222-64-209.ca-central-1.compute.amazonaws.com
  DOCS_USER: ubuntu
  DOCS_ROOT: /home/ubuntu/docshome/

jobs:

  deploy:
    runs-on: ubuntu-latest
    steps:

    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: SSH into the server
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.DOCS_SSH_KEY }}" > ~/.ssh/docs_key.pem
        chmod 600 ~/.ssh/docs_key.pem
        ssh-keyscan -H ${DOCS_HOST} >> ~/.ssh/known_hosts

        git fetch origin gh-pages
        git worktree add /tmp/gh-pages origin/gh-pages

        rsync -rv --delete \
          -e "ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -i ~/.ssh/docs_key.pem" \
          /tmp/gh-pages/ \
          "${DOCS_USER}@${DOCS_HOST}:${DOCS_ROOT}/"

        git worktree prune
        git worktree remove /tmp/gh-pages