# .github/workflows/release-new-version.yml

# Thin trigger stub: the real logic lives in release-new-version-impl.yml on
# the ciworkflows branch (all CI/release assets live there; main only keeps
# the ci-caller.yml delegator and workflow_dispatch stubs like this one,
# since GitHub only lets workflow_dispatch workflows be triggered from
# workflow files present on the default branch).
name: Release new version

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: deploy-docs
  queue: max

jobs:
  release:
    uses: augustmckendrick/queuetester/.github/workflows/release-new-version-impl.yml@ciworkflows
    secrets: inherit
